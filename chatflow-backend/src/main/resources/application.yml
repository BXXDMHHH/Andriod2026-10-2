spring:
  application:
    name: chatflow-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chatflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:chatflow}
    password: ${DB_PASSWORD:chatflow_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
security:
  jwt:
    secret: ${JWT_SECRET:Y2hhdGZsb3ctZGV2LWp3dC1zZWNyZXQtMzItYnl0ZXMtbWluaW11bSE=}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
