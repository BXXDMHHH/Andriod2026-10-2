services:
  mysql:
    image: mysql:8.0
    container_name: chatflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatflow}
      MYSQL_USER: ${MYSQL_USER:-chatflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatflow_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../chatflow-backend
    container_name: chatflow-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/chatflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-chatflow}
      DB_PASSWORD: ${DB_PASSWORD:-chatflow_dev_password}
      JWT_SECRET: ${JWT_SECRET:-Y2hhdGZsb3ctZGV2LWp3dC1zZWNyZXQtMzItYnl0ZXMtbWluaW11bSE=}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      SERVER_PORT: ${SERVER_PORT:-8080}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: chatflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
