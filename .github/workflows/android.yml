name: Android CI

on:
  push:
    paths:
      - "chatflow-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "chatflow-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        working-directory: chatflow-android
        run: gradle assembleDebug
      - name: Run JVM unit tests
        working-directory: chatflow-android
        run: gradle testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: chatflow-debug-apk
          path: chatflow-android/app/build/outputs/apk/debug/app-debug.apk

  instrumentation:
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run Compose instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: chatflow-android
          script: gradle connectedDebugAndroidTest
