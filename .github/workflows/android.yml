name: Android CI

on:
  push:
    paths:
      - "chatflow-android/**"
      - ".github/workflows/android.yml"
      - "chatflow-backend/**"
      - "chatflow-deploy/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "chatflow-android/**"
      - ".github/workflows/android.yml"
      - "chatflow-backend/**"
      - "chatflow-deploy/**"
      - ".github/scripts/**"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        working-directory: chatflow-android
        run: gradle assembleDebug
      - name: Run JVM unit tests
        working-directory: chatflow-android
        run: gradle testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: chatflow-debug-apk
          path: chatflow-android/app/build/outputs/apk/debug/app-debug.apk

  instrumentation:
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run Compose instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: chatflow-android
          script: gradle connectedDebugAndroidTest
  real-backend-e2e:
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: chatflow-backend/pom.xml
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Start MySQL and Redis
        run: docker compose -f chatflow-deploy/docker-compose.yml up -d --wait
      - name: Start Spring Boot
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/chatflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: chatflow
          DB_PASSWORD: chatflow_dev_password
        run: |
          nohup mvn -q -f chatflow-backend/pom.xml spring-boot:run > /tmp/chatflow-backend.log 2>&1 &
          echo $! > /tmp/chatflow-backend.pid
          python .github/scripts/wait_for_backend.py
      - name: Run real backend Android E2E
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: chatflow-android
          script: gradle connectedDebugAndroidTest
      - name: Show backend logs
        if: always()
        run: |
          if [ -f /tmp/chatflow-backend.log ]; then tail -n 160 /tmp/chatflow-backend.log; fi
      - name: Stop services
        if: always()
        run: docker compose -f chatflow-deploy/docker-compose.yml down -v
