name: Deployment and MySQL Integration CI

on:
  push:
    paths:
      - "chatflow-backend/**"
      - "chatflow-deploy/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/mysql_api_smoke.py"
  pull_request:
    paths:
      - "chatflow-backend/**"
      - "chatflow-deploy/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/mysql_api_smoke.py"
  workflow_dispatch:

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f chatflow-deploy/docker-compose.yml config --quiet
      - name: Build and start deployment stack
        run: docker compose -f chatflow-deploy/docker-compose.yml up -d --build --wait
      - name: Verify MySQL responds to a query
        run: docker compose -f chatflow-deploy/docker-compose.yml exec -T mysql mysql --user=chatflow --password=chatflow_dev_password --database=chatflow --execute="SELECT 1;"
      - name: Verify Redis responds to PING
        run: test "$(docker compose -f chatflow-deploy/docker-compose.yml exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Wait for backend health
        run: python .github/scripts/wait_for_backend.py
      - name: Exercise API against deployed backend
        run: python .github/scripts/mysql_api_smoke.py
      - name: Show service status and logs
        if: always()
        run: |
          docker compose -f chatflow-deploy/docker-compose.yml ps
          docker compose -f chatflow-deploy/docker-compose.yml logs --no-color --tail=120 backend nginx
      - name: Stop services
        if: always()
        run: docker compose -f chatflow-deploy/docker-compose.yml down -v
