name: Backend CI

on:
  push:
    paths:
      - "chatflow-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "chatflow-backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: chatflow-backend/pom.xml
      - name: Verify backend
        working-directory: chatflow-backend
        run: mvn --batch-mode --no-transfer-progress clean verify
